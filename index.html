<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming Hub</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>
    <h1>Streaming Hub</h1>
    <p>Connect all your streaming services in one place</p>
</header>

<section class="services-grid">

    <div class="service-card" data-service="Netflix">
        <img src="assets/images/netflix.png" alt="Netflix">
        <h3>Netflix</h3>

        <input type="text" placeholder="Email">

        <button class="connect-btn">
            Connect
        </button>
    </div>

    <div class="service-card" data-service="Disney+">
        <img src="assets/images/disney.png" alt="Disney+">
        <h3>Disney+</h3>

        <input type="text" placeholder="Email">

        <button class="connect-btn">
            Connect
        </button>
    </div>

    <div class="service-card" data-service="Hulu">
        <img src="assets/images/hulu.png" alt="Hulu">
        <h3>Hulu</h3>

        <input type="text" placeholder="Email">

        <button class="connect-btn">
            Connect
        </button>
    </div>

    <div class="service-card" data-service="Prime Video">
        <img src="assets/images/prime.png" alt="Prime">
        <h3>Prime Video</h3>

        <input type="text" placeholder="Email">

        <button class="connect-btn">
            Connect
        </button>
    </div>

    <div class="service-card" data-service="HBO Max">
        <img src="assets/images/max.png" alt="Max">
        <h3>HBO Max</h3>

        <input type="text" placeholder="Email">

        <button class="connect-btn">
            Connect
        </button>
    </div>

</section>

<div class="dashboard-btn-container">
    <a href="dashboard.html" class="dashboard-btn">
        View All Series & Movies
    </a>
</div>

<script src="assets/js/app.js"></script>

</body>
</html>
